name: 🐛 勘误
description: 报告教程里的错别字、错误命令或过时内容
title: "[勘误] "
labels: ["errata"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮忙纠错。**请不要贴出 API Key、邮箱等隐私信息。**
  - type: input
    id: location
    attributes:
      label: 出问题的位置
      description: 章节文件和标题，例如 `docs/01-meet-opencode.md` 的"CLI 常用指令"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 教程里写了什么，实际应该是什么？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 依据（可选）
      description: 官方文档链接，或你的实测输出
  - type: input
    id: version
    attributes:
      label: OpenCode 版本
      description: 运行 `opencode -v` 查看
      placeholder: 2.2.5
